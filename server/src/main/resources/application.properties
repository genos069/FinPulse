spring.application.name=expensetrackerapp

# Server Port
server.port=${PORT:8080}

# MongoDB Configuration
# Connection URI can be overridden with MONGODB_URI env variable
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/expensetrackerdb}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# MUST be set via the JWT_SECRET environment variable. No hardcoded default permitted.
application.jwt.secret=${JWT_SECRET:}
# Default expiration: 24 hours (86400000 ms)
application.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# JWT issuer
application.jwt.issuer=${JWT_ISSUER:expensetrackerapp}

# CORS Configuration
# Comma-separated list of allowed origins (e.g. for React Native dev and web preview)
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
